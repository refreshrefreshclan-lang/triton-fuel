<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,viewport-fit=cover">
<meta name="description" content="Track your UCSD dining hall meals with official HDH nutrition facts.">
<meta name="theme-color" content="#F2F2F7" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#000000" media="(prefers-color-scheme: dark)">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Triton Fuel">
<link rel="icon" href="icon.svg" type="image/svg+xml">
<style>:root{padding-top:var(--safe-area-inset-top,env(safe-area-inset-top,0px))}body{margin:0}</style>
</head>
<body>
<title>Triton Fuel</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Figtree:wght@400;500;600;700;800&family=Nunito:wght@600;700;800&display=swap">
<style>
:root{
  --bg:#F2F2F7; --card:#FFFFFF; --card-2:#F6F6F9;
  --ink:#0C0C10; --ink-2:#6C6C75; --ink-3:#A3A3AC;
  --hair:rgba(60,60,67,.13); --fill:rgba(118,118,128,.12); --track:rgba(118,118,128,.14);
  --glass:rgba(255,255,255,.74); --glass-edge:rgba(255,255,255,.9);
  --shadow:0 1px 2px rgba(16,16,32,.04),0 10px 30px rgba(16,16,48,.06);
  --kcal:#FF375F; --pro:#2F7BF6; --carb:#2DBE58; --fat:#FF9F0A;
  --fib:#AF52DE; --sug:#5E5CE6; --na:#22A8C4; --sat:#FF6B35; --chol:#E0A800;
  --warn:#FF3B30; --ok:#2DBE58;
  --tabbar:rgba(249,249,251,.82);
  --ch-kcal:#FF375F; --ch-pro:#2F7BF6; --ch-carb:#1E9E4A; --ch-fat:#C77500; --ch-fib:#AF52DE;
  --sans:-apple-system,BlinkMacSystemFont,"SF Pro Text","Figtree",system-ui,sans-serif;
  --display:-apple-system,BlinkMacSystemFont,"SF Pro Display","Figtree",system-ui,sans-serif;
  --round:ui-rounded,"SF Pro Rounded","Nunito",-apple-system,system-ui,sans-serif;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    color-scheme:dark;
    --bg:#000000; --card:#1C1C1E; --card-2:#2C2C2E;
    --ink:#F5F5F7; --ink-2:#9C9CA5; --ink-3:#66666C;
    --hair:rgba(84,84,88,.55); --fill:rgba(118,118,128,.24); --track:rgba(118,118,128,.26);
    --glass:rgba(28,28,30,.7); --glass-edge:rgba(255,255,255,.08);
    --shadow:0 0 0 1px rgba(255,255,255,.03);
    --kcal:#FF4F73; --pro:#4A8FFF; --carb:#34D463; --fat:#FFB02E;
    --fib:#C274F0; --sug:#7D7BFF; --na:#3CC4DE; --sat:#FF8458; --chol:#FFCC1A;
    --tabbar:rgba(22,22,24,.82);
    --ch-kcal:#FF4F73; --ch-pro:#4A8FFF; --ch-carb:#34D463; --ch-fat:#FFB02E; --ch-fib:#C274F0;
  }
}
:root[data-theme="dark"]{
  color-scheme:dark;
  --bg:#000000; --card:#1C1C1E; --card-2:#2C2C2E;
  --ink:#F5F5F7; --ink-2:#9C9CA5; --ink-3:#66666C;
  --hair:rgba(84,84,88,.55); --fill:rgba(118,118,128,.24); --track:rgba(118,118,128,.26);
  --glass:rgba(28,28,30,.7); --glass-edge:rgba(255,255,255,.08);
  --shadow:0 0 0 1px rgba(255,255,255,.03);
  --kcal:#FF4F73; --pro:#4A8FFF; --carb:#34D463; --fat:#FFB02E;
  --fib:#C274F0; --sug:#7D7BFF; --na:#3CC4DE; --sat:#FF8458; --chol:#FFCC1A;
  --tabbar:rgba(22,22,24,.82);
  --ch-kcal:#FF4F73; --ch-pro:#4A8FFF; --ch-carb:#34D463; --ch-fat:#FFB02E; --ch-fib:#C274F0;
}

*{box-sizing:border-box}
[hidden]{display:none!important}
html,body{height:100%}
html{-webkit-text-size-adjust:100%;text-size-adjust:100%}
html,body{overflow-x:hidden;max-width:100%}
/* iPhones zoom the page when a text box under 16px is tapped, so every text box is at least 16px */
input,select,textarea{font-size:16px}
body.sheet-open{overflow:hidden}
body{background:var(--bg);color:var(--ink);font-family:var(--sans);font-size:15px;line-height:1.35;-webkit-font-smoothing:antialiased;-webkit-tap-highlight-color:transparent}
button{font:inherit;color:inherit;background:none;border:0;padding:0;cursor:pointer}
button:focus-visible,input:focus-visible,[tabindex]:focus-visible{outline:2px solid var(--pro);outline-offset:2px;border-radius:10px}
.num{font-family:var(--round);font-variant-numeric:tabular-nums}

.app{max-width:480px;margin:0 auto;padding-inline:16px;padding-block:8px calc(96px + var(--safe-area-inset-bottom,env(safe-area-inset-bottom,0px)))}
.screen{display:flex;flex-direction:column;gap:22px}

/* Header */
.head{display:flex;align-items:flex-end;justify-content:space-between;gap:12px;padding-top:14px}
.eyebrow{font-size:13px;font-weight:600;letter-spacing:.04em;text-transform:uppercase;color:var(--ink-2)}
.large-title{font-family:var(--display);font-size:34px;font-weight:800;letter-spacing:-.02em;line-height:1.1;margin:2px 0 0}
.pill-btn{background:var(--card);box-shadow:var(--shadow);border-radius:999px;padding:8px 14px;font-weight:600;font-size:14px;color:var(--pro);white-space:nowrap}

/* Section */
.section{display:flex;flex-direction:column;gap:8px}
.section-h{display:flex;align-items:baseline;justify-content:space-between;padding-inline:4px}
.section-h h2{font-family:var(--display);font-size:22px;font-weight:700;letter-spacing:-.01em;margin:0}
.section-h .aside{font-size:13px;color:var(--ink-2)}
.card{background:var(--card);border-radius:20px;box-shadow:var(--shadow)}

/* Banner */
.banner{display:flex;align-items:center;gap:12px;background:var(--card);border-radius:16px;padding:12px 14px;box-shadow:var(--shadow);font-size:13.5px;color:var(--ink-2)}
.banner b{color:var(--ink);font-weight:600}
.banner .pill-btn{box-shadow:none;background:var(--fill);padding:6px 12px;font-size:13px;margin-left:auto}

/* Bubble ring */
.ring-card{padding:20px 16px 18px;display:flex;flex-direction:column;align-items:center;gap:16px}
.ring-wrap{position:relative;width:min(100%,320px);aspect-ratio:1;max-width:100%}
.ring-wrap svg{width:100%;height:100%;display:block;overflow:visible}
.core{position:absolute;left:50%;top:50%;width:43%;aspect-ratio:1;transform:translate(-50%,-50%);border-radius:50%;
  background:var(--glass);-webkit-backdrop-filter:blur(14px) saturate(160%);backdrop-filter:blur(14px) saturate(160%);
  border:1px solid var(--glass-edge);box-shadow:0 8px 28px rgba(0,0,0,.08);
  display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;gap:1px}
.core .eyebrow{font-size:10.5px;letter-spacing:.08em}
.core .kcal{font-family:var(--round);font-weight:800;font-size:clamp(30px,10vw,40px);letter-spacing:-.02em;line-height:1.05;font-variant-numeric:tabular-nums}
.core .of{font-size:12.5px;color:var(--ink-2);font-variant-numeric:tabular-nums}
.left-line{font-size:14px;color:var(--ink-2);display:flex;align-items:center;gap:8px}
.left-line b{color:var(--ink);font-family:var(--round);font-weight:800;font-variant-numeric:tabular-nums}
.left-line .dot{width:8px;height:8px;border-radius:50%;background:var(--kcal)}
.float{animation:drift 7s ease-in-out infinite}
.float.b{animation-duration:8.5s;animation-delay:-2s}
.float.c{animation-duration:6.2s;animation-delay:-4s}
@keyframes drift{0%,100%{transform:translate(0,0)}33%{transform:translate(1.8px,-2.6px)}66%{transform:translate(-2.2px,1.4px)}}
@media (prefers-reduced-motion: reduce){.float{animation:none}}

/* Macro trio */
.macros{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;width:100%}
.macro{background:var(--card-2);border-radius:16px;padding:12px 12px 12px;display:flex;flex-direction:column;gap:6px;min-width:0}
.macro .name{display:flex;align-items:center;gap:6px;font-size:13px;font-weight:600;color:var(--ink-2)}
.macro .sw{width:9px;height:9px;border-radius:50%}
.macro .val{font-family:var(--round);font-weight:800;font-size:22px;font-variant-numeric:tabular-nums;letter-spacing:-.01em}
.macro .val small{font-size:13px;font-weight:700;color:var(--ink-2);margin-left:1px}
.macro .goal{font-size:12px;color:var(--ink-2);font-variant-numeric:tabular-nums}
.bar{height:6px;border-radius:99px;background:var(--track);overflow:hidden}
.bar i{display:block;height:100%;border-radius:99px;transition:width .6s cubic-bezier(.2,.8,.2,1)}

/* Nutrient list */
.list{display:flex;flex-direction:column}
.row{display:grid;grid-template-columns:auto 1fr auto;align-items:center;column-gap:12px;padding:13px 16px;position:relative}
.row + .row::before{content:"";position:absolute;top:0;left:52px;right:0;height:1px;background:var(--hair)}
.chip-ic{width:28px;height:28px;border-radius:8px;display:grid;place-items:center;color:#fff;font-weight:800;font-size:12px;font-family:var(--round)}
.nrow .mid{display:flex;flex-direction:column;gap:7px;min-width:0}
.nrow .top{display:flex;justify-content:space-between;align-items:baseline;gap:8px}
.nrow .label{font-weight:600}
.nrow .tag{white-space:nowrap;font-size:11px;font-weight:600;color:var(--ink-2);background:var(--fill);border-radius:6px;padding:1px 6px;margin-left:6px;letter-spacing:.02em}
.nrow .tag.over{color:#fff;background:var(--warn)}
.nrow .amt{font-size:14px;color:var(--ink-2);font-variant-numeric:tabular-nums;white-space:nowrap}
.nrow .amt b{color:var(--ink);font-family:var(--round);font-weight:800;font-size:16px}
.nrow{grid-template-columns:auto 1fr}

/* Meals */
.meal-group{display:flex;flex-direction:column;gap:6px}
.meal-h{font-size:13px;font-weight:600;letter-spacing:.04em;text-transform:uppercase;color:var(--ink-2);padding-inline:4px;display:flex;justify-content:space-between}
.meal-h span:last-child{font-variant-numeric:tabular-nums;letter-spacing:0;text-transform:none}
.food{grid-template-columns:1fr auto;cursor:pointer;text-align:left;width:100%}
.food + .food::before{left:16px}
.food .nm{font-weight:600;overflow-wrap:anywhere}
.food .sub{font-size:13px;color:var(--ink-2);margin-top:2px}
.food .k{font-family:var(--round);font-weight:800;font-variant-numeric:tabular-nums}
.food .k small{font-family:var(--sans);font-weight:500;color:var(--ink-2);font-size:12px;margin-left:2px}
.mini-macros{display:flex;gap:8px;margin-top:5px;font-size:12px;color:var(--ink-2);font-variant-numeric:tabular-nums;flex-wrap:wrap}
.mini-macros span{display:inline-flex;align-items:center;gap:4px}
.mini-macros i{width:6px;height:6px;border-radius:50%;display:inline-block}
.empty{padding:22px 16px;text-align:center;color:var(--ink-2);font-size:14px}

/* Dining */
.hall{padding:14px 16px;display:flex;align-items:center;gap:12px}
.hall .logo{width:44px;height:44px;border-radius:12px;background:linear-gradient(145deg,#1E5BD8,#22A8C4);display:grid;place-items:center;color:#fff;font-weight:800;font-family:var(--round);font-size:15px;flex:none}
.hall .t{font-weight:700;font-size:16px}
.hall .s{font-size:13px;color:var(--ink-2)}
.hall .open{margin-left:auto;font-size:12px;font-weight:700;color:var(--ok);background:color-mix(in srgb,var(--ok) 14%,transparent);padding:4px 9px;border-radius:99px;white-space:nowrap}
.seg{display:grid;grid-auto-flow:column;grid-auto-columns:1fr;background:var(--fill);border-radius:10px;padding:2px;gap:2px}
.seg button{padding:7px 4px;border-radius:8px;font-weight:600;font-size:13.5px;color:var(--ink)}
.seg button[aria-pressed="true"]{background:var(--card);box-shadow:0 1px 3px rgba(0,0,0,.12)}
.search{display:flex;align-items:center;gap:8px;background:var(--fill);border-radius:12px;padding:9px 12px}
.search svg{flex:none;color:var(--ink-2)}
.search input{border:0;outline:0;background:transparent;font:inherit;font-size:16px;color:var(--ink);width:100%;min-width:0}
.search input::placeholder{color:var(--ink-2)}
.menu-item{grid-template-columns:1fr auto;align-items:center;cursor:pointer}
.menu-item + .menu-item::before{left:16px}
.menu-item .nm{font-weight:600}
.menu-item .ds{font-size:13px;color:var(--ink-2);margin-top:2px;overflow-wrap:anywhere}
.menu-item .right{display:flex;align-items:center;gap:10px}
.menu-item .k{font-family:var(--round);font-weight:800;font-variant-numeric:tabular-nums;font-size:15px;text-align:right}
.menu-item .k small{display:block;font-family:var(--sans);font-weight:500;font-size:11px;color:var(--ink-2)}
.add{width:32px;height:32px;border-radius:50%;background:color-mix(in srgb,var(--pro) 14%,transparent);color:var(--pro);display:grid;place-items:center;flex:none;transition:transform .15s}
.add:active{transform:scale(.9)}
.note{font-size:12.5px;color:var(--ink-2);padding-inline:4px;line-height:1.45}
.note a{color:var(--pro)}
.data-status{display:flex;align-items:center;gap:12px;padding:12px 14px}
.status-dot{width:10px;height:10px;border-radius:50%;flex:none;background:var(--ok);box-shadow:0 0 0 4px color-mix(in srgb,var(--ok) 18%,transparent)}
.status-dot.warn{background:var(--fat);box-shadow:0 0 0 4px color-mix(in srgb,var(--fat) 20%,transparent)}
.status-txt{display:flex;flex-direction:column;gap:1px;min-width:0;font-size:13px;color:var(--ink-2)}
.status-txt b{color:var(--ink);font-size:14px;font-weight:650}
.chips-scroll{overflow-x:auto;margin-inline:-16px;padding-inline:16px;scrollbar-width:none}
.chips-scroll::-webkit-scrollbar{display:none}
.chips{display:flex;gap:8px;width:max-content;padding-block:2px}
.chips button{background:var(--card);box-shadow:var(--shadow);border-radius:999px;padding:8px 14px;font-weight:600;font-size:14px;white-space:nowrap}
.chips button[aria-pressed="true"]{background:var(--ink);color:var(--bg)}
.chips button small{font-weight:500;opacity:.6;margin-left:4px;font-variant-numeric:tabular-nums}
.partial{font-size:11px;font-weight:600;color:var(--fat);margin-top:3px}
.back{display:inline-flex;align-items:center;gap:6px;color:var(--pro);font-weight:600;font-size:16px;padding:4px 0 8px}
.hall-row{display:grid;grid-template-columns:auto 1fr auto auto;align-items:center;column-gap:12px;padding:12px 14px 12px 16px;width:100%;text-align:left;position:relative}
.hall-row + .hall-row::before{content:"";position:absolute;top:0;left:72px;right:0;height:1px;background:var(--hair)}
.hall-row .logo{width:42px;height:42px;border-radius:12px;display:grid;place-items:center;color:#fff;font-weight:800;font-family:var(--round);font-size:14px;letter-spacing:-.01em}
.hall-row .t{font-weight:700;font-size:16px}
.hall-row .s{font-size:13px;color:var(--ink-2);margin-top:1px;font-variant-numeric:tabular-nums}
.hall-row .chev{color:var(--ink-3)}
.hall-row.dim .logo{opacity:.45}
.st{font-size:12px;font-weight:700;padding:4px 9px;border-radius:99px;white-space:nowrap}
.st.open{color:var(--ok);background:color-mix(in srgb,var(--ok) 14%,transparent)}
.st.later{color:var(--fat);background:color-mix(in srgb,var(--fat) 16%,transparent)}
.st.closed{color:var(--ink-2);background:var(--fill)}
.hall-meta{display:flex;align-items:center;gap:10px;flex-wrap:wrap;color:var(--ink-2);font-size:14px;font-variant-numeric:tabular-nums;margin-top:-10px}
.chips button{display:flex;flex-direction:column;align-items:flex-start;gap:1px;line-height:1.2}
.chips button .h{font-size:11px;font-weight:600;opacity:.62}
.chips button.off{opacity:.55}
.nrow .note-sm{font-size:12.5px;color:var(--ink-2)}
.macro .goal.free{color:var(--ink-2)}
/* Week / history */
.metric-chips button{flex-direction:row;align-items:center;gap:7px}
.metric-chips button .dot{width:8px;height:8px;border-radius:50%;flex:none}
.chart-card{padding:16px 16px 12px;display:flex;flex-direction:column;gap:10px}
.chart-head{display:flex;justify-content:space-between;align-items:flex-start;gap:12px;min-height:74px}
.chart-head .big{font-family:var(--round);font-weight:800;font-size:34px;letter-spacing:-.02em;line-height:1.1;font-variant-numeric:tabular-nums}
.chart-head .big small{font-family:var(--sans);font-size:15px;font-weight:600;color:var(--ink-2);margin-left:4px;letter-spacing:0}
.chart-head .rng{font-size:13.5px;color:var(--ink-2);font-variant-numeric:tabular-nums;margin-top:1px}
.pager{display:flex;gap:6px;flex:none}
.pager button{width:32px;height:32px;border-radius:50%;background:var(--fill);display:grid;place-items:center;color:var(--ink)}
.pager button:disabled{opacity:.3;cursor:default}
.chart{position:relative;width:100%;touch-action:pan-y}
.chart svg{display:block;width:100%;overflow:visible}
.chart .empty-msg{position:absolute;inset:0 36px 24px 0;display:grid;place-items:center;text-align:center;color:var(--ink-2);font-size:13.5px;padding:0 20px}
.table-card{padding:0}
.table-card summary{padding:13px 16px;font-weight:600;cursor:pointer;color:var(--pro)}
.table-card table{width:100%;border-collapse:collapse;font-size:14px;font-variant-numeric:tabular-nums}
.table-card td,.table-card th{padding:8px 16px;border-top:1px solid var(--hair);text-align:left}
.table-card td:last-child,.table-card th:last-child{text-align:right}
.table-card th{font-size:12px;color:var(--ink-2);font-weight:600;text-transform:uppercase;letter-spacing:.04em}
.stat{display:flex;justify-content:space-between;align-items:baseline;gap:12px;padding:12px 16px;position:relative}
.stat + .stat::before{content:"";position:absolute;top:0;left:16px;right:0;height:1px;background:var(--hair)}
.stat span{color:var(--ink-2);font-size:14px}
.stat b{font-family:var(--round);font-weight:800;font-variant-numeric:tabular-nums}
.stat b small{font-family:var(--sans);font-weight:500;color:var(--ink-2);font-size:12.5px;margin-left:3px}
.diet{display:inline-block;font-size:10.5px;font-weight:700;color:var(--carb);background:color-mix(in srgb,var(--carb) 13%,transparent);border-radius:5px;padding:1px 5px;margin-left:6px;vertical-align:2px;letter-spacing:.02em}

/* Tab bar */
.tabbar{position:fixed;left:0;right:0;bottom:0;z-index:20;background:var(--tabbar);-webkit-backdrop-filter:blur(20px) saturate(180%);backdrop-filter:blur(20px) saturate(180%);border-top:1px solid var(--hair);padding:6px 16px calc(6px + var(--safe-area-inset-bottom,env(safe-area-inset-bottom,0px)))}
.tabbar .in{max-width:480px;margin:0 auto;display:grid;grid-template-columns:1fr 1fr 1fr}
.tab{display:flex;flex-direction:column;align-items:center;gap:2px;padding:4px 0;font-size:11px;font-weight:600;color:var(--ink-3)}
.tab[aria-selected="true"]{color:var(--kcal)}

/* Sheet */
.scrim{position:fixed;inset:0;z-index:40;background:rgba(0,0,0,.32);display:flex;align-items:flex-end;justify-content:center;opacity:0;transition:opacity .22s}
.scrim.show{opacity:1}
.sheet{background:var(--bg);width:100%;max-width:520px;max-height:90%;overflow-y:auto;overflow-x:hidden;overscroll-behavior:contain;-webkit-overflow-scrolling:touch;border-radius:22px 22px 0 0;padding:8px 16px calc(20px + var(--safe-area-inset-bottom,env(safe-area-inset-bottom,0px)));transform:translateY(24px);transition:transform .28s cubic-bezier(.2,.8,.2,1);display:flex;flex-direction:column;gap:16px}
.scrim.show .sheet{transform:none}
.grabber{width:36px;height:5px;border-radius:99px;background:var(--ink-3);opacity:.5;margin:2px auto 0}
.sheet-h{display:flex;justify-content:space-between;align-items:flex-start;gap:12px}
.sheet-h h3{font-family:var(--display);font-size:24px;font-weight:800;letter-spacing:-.015em;margin:4px 0 2px;text-wrap:balance}
.sheet-h p{margin:0;color:var(--ink-2);font-size:14px}
.x{width:30px;height:30px;border-radius:50%;background:var(--fill);display:grid;place-items:center;color:var(--ink-2);flex:none}
.stepper{display:flex;align-items:center;justify-content:space-between;padding:12px 16px}
.stepper .lbl{font-weight:600}
.stepper .ctl{display:flex;align-items:center;gap:6px;background:var(--fill);border-radius:10px;padding:2px}
.stepper .ctl button{width:40px;height:32px;border-radius:8px;font-size:20px;font-weight:500}
.stepper .ctl button:active{background:var(--card)}
.stepper .ctl output{min-width:58px;text-align:center;font-family:var(--round);font-weight:800;font-variant-numeric:tabular-nums}
.cta{background:var(--kcal);color:#fff;border-radius:14px;padding:15px;font-weight:700;font-size:16px;width:100%}
.cta.ghost{background:var(--card);color:var(--warn);box-shadow:var(--shadow)}
.cta-row{display:flex;flex-direction:column;gap:10px}

/* Nutrition facts label */
.nf{background:var(--card);color:var(--ink);border:1.5px solid var(--ink);border-radius:6px;padding:8px 10px 10px;font-family:"Helvetica Neue",Arial,"Figtree",sans-serif}
.nf h4{font-size:30px;font-weight:900;letter-spacing:-.02em;margin:0;line-height:1}
.nf .serv{display:flex;justify-content:space-between;font-weight:700;font-size:14px;padding:3px 0 5px;border-bottom:9px solid var(--ink)}
.nf .cal{display:flex;justify-content:space-between;align-items:flex-end;padding:3px 0 2px;border-bottom:5px solid var(--ink)}
.nf .cal .l{font-weight:900;font-size:22px}
.nf .cal .v{font-weight:900;font-size:34px;line-height:1;font-variant-numeric:tabular-nums}
.nf .dvh{text-align:right;font-weight:700;font-size:12px;padding:3px 0;border-bottom:1px solid var(--ink)}
.nf .r{display:flex;justify-content:space-between;font-size:14px;padding:3px 0;border-bottom:1px solid var(--ink);font-variant-numeric:tabular-nums}
.nf .r.ind{padding-left:16px}
.nf .r.ind2{padding-left:32px}
.nf .r.thick{border-bottom:9px solid var(--ink)}
.nf .r b{font-weight:800}
.nf .foot{font-size:11px;line-height:1.35;padding-top:5px;color:var(--ink-2)}

/* Goals form */
.field{display:grid;grid-template-columns:auto 1fr auto;align-items:center;gap:12px;padding:11px 16px;position:relative}
.field + .field::before{content:"";position:absolute;top:0;left:52px;right:0;height:1px;background:var(--hair)}
.field label{font-weight:600}
.field input{width:92px;text-align:right;font:inherit;font-size:16px;font-family:var(--round);font-weight:800;font-variant-numeric:tabular-nums;border:0;background:var(--fill);border-radius:8px;padding:6px 8px;color:var(--ink)}
.field .u{font-size:13px;color:var(--ink-2);width:26px}

/* Toast */
.toast{position:fixed;left:50%;bottom:calc(84px + var(--safe-area-inset-bottom,env(safe-area-inset-bottom,0px)));transform:translate(-50%,20px);opacity:0;z-index:50;background:var(--ink);color:var(--bg);border-radius:14px;padding:11px 12px 11px 16px;display:flex;align-items:center;gap:14px;font-size:14px;font-weight:600;box-shadow:0 10px 30px rgba(0,0,0,.2);transition:all .25s;max-width:calc(100% - 32px);pointer-events:none}
.toast.show{opacity:1;transform:translate(-50%,0);pointer-events:auto}
.toast button{color:var(--kcal);font-weight:700;padding:4px 6px;filter:brightness(1.15)}
</style>

/* ---------- Menu data: synced file (built in or loaded) beats the sample ---------- */
const MENU_KEY = 'tritonfuel.menu.v1';
function sampleMenu(){

    it.periods.split('').forEach(L=>items.push({id:it.id, name:it.name, desc:it.desc, station:it.station,
      period:LETTER[L], serving:null, allergens:null, n:{...it.n}, complete:true}));
  });
  return {sample:true, generated:null, date:null, halls:[{name:'OceanView', items}]};
}
const DIET = ['Vegan','Vegetarian','Wellness'];
const TAG_FIX = {TreeNuts:'Tree Nuts', Sustainability:null};
// The browser collector saves a compact file (shared string table); the sync script saves plain items. Accept both.
function expandMenu(m){
  if(!m || !m.S || !m.nut) return m;
  const S = m.S;
  return {date:m.date, generated:m.generated, source:m.source, halls:m.halls.map(h=>{
    const whole = (h.venues||[]).find(v=>v.sub==='00');
    return {name:h.name, hours: whole ? whole.hours : null,
      venues:(h.venues||[]).filter(v=>v.sub!=='00').map(v=>({name:v.name, hours:v.hours})),
      items:h.rows.map(r=>{
        const n = m.nut[r[5]];
        const tags = S[n[12]].split(',').filter(Boolean).map(t=>t in TAG_FIX ? TAG_FIX[t] : t).filter(Boolean);
        return {id:n[0], name:S[r[0]], desc:S[r[1]], period:S[r[2]], station:S[r[3]], sub:S[r[4]], serving:S[n[11]]||null, menuKcal:r[6],

          n:{kcal:n[1],fat:n[2],sat:n[3],trans:n[4],chol:n[5],na:n[6],carb:n[7],fib:n[8],sug:n[9],pro:n[10]}, complete:true};
      })};
  })};
}
function useMenuCalories(m){
  if(!m || !m.halls) return m;
  m.halls.forEach(h=>(h.items||[]).forEach(it=>{
    if(!it.diet && typeof it.allergens==='string'){   // sync-script files list diet tags with allergens
      const tags = it.allergens.split(/,\s*/).filter(Boolean);
      it.diet = tags.filter(t=>DIET.includes(t)); it.allergens = tags.filter(t=>!DIET.includes(t)).join(', ') || null;
    }
    if(it.menuKcal!=null && it.n && it.n.kcal!=null && Math.round(it.menuKcal)!==Math.round(it.n.kcal) && it.pageKcal==null){
      it.pageKcal = it.n.kcal; it.n = {...it.n, kcal: it.menuKcal};
    }
  }));
  return m;
}
const validMenu = m => m && Array.isArray(m.halls) && m.halls.some(h=>Array.isArray(h.items) && h.items.length);
function readEmbedded(){ try{ const t=document.getElementById('menu-data').textContent.trim(); return t && t!=='null' ? useMenuCalories(expandMenu(JSON.parse(t))) : null; }catch(e){ return null; } }
function readStored(){ try{ return useMenuCalories(expandMenu(JSON.parse(localStorage.getItem(MENU_KEY)||'null'))); }catch(e){ return null; } }
function pickMenu(){
  const c = [readEmbedded(), readStored()].filter(validMenu).sort((a,b)=>String(b.generated||'').localeCompare(String(a.generated||'')));
  return c[0] || sampleMenu();
}
let MENU = pickMenu();

function load(){ try{ return JSON.parse(localStorage.getItem(KEY)||'null'); }catch(e){ return null; } }
function save(){ try{ localStorage.setItem(KEY,JSON.stringify(state)); }catch(e){} }
const snap = (it, hall, s, meal) => ({uid:'u'+Date.now().toString(36)+Math.random().toString(36).slice(2,6), name:it.name, hall, n:{...it.n}, serving:it.serving||null, allergens:it.allergens||null, diet:it.diet||[], pageKcal:it.pageKcal??null, s, meal, placeholder:!!MENU.sample});
function realExamples(){
  if(MENU.sample) return null;
  const find = (hall, name, period) => { const h=MENU.halls.find(x=>x.name===hall); return h && h.items.find(i=>i.name===name && (!period||i.period===period)); };
  const picks = [['OceanView','Everything Bagel',1,'Breakfast'],['OceanView','Chicken Shawarma Mazza Bowl',1,'Lunch'],['OceanView','Hummus and Pita',0.5,'Lunch']]
    .map(([h,n,s,m])=>{ const it=find(h,n); return it ? {...snap(it,h,s,m), ex:true} : null; }).filter(Boolean);
  return picks.length>=2 ? picks : null;
}
const HKEYS = ['kcal','pro','carb','fat','fib'];
const isoOf = d => d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0');
const keyToISO = k => { const [y,m,d]=String(k).split('-').map(Number); return y+'-'+String(m).padStart(2,'0')+'-'+String(d).padStart(2,'0'); };
const realEntries = log => (log||[]).filter(e=>!e.ex && !e.placeholder);
function dayTotals(log){
  const t={n:log.length}; HKEYS.forEach(k=>t[k]=Math.round(log.reduce((a,e)=>a+(e.n[k]||0)*e.s,0)*10)/10);
  return t;
}
// Keep each finished day's totals so the Week tab can chart weeks, months and years.
function archiveDay(st){
  const real = realEntries(st.log);
  if(!st.day || !real.length) return;
  st.history = st.history || {};
  st.history[keyToISO(st.day)] = dayTotals(real);
}
let state = load();
if(state && state.example && state.day===todayKey() && state.log.every(e=>e.placeholder)){ const ex=realExamples(); if(ex) state.log=ex; }
if(!state){
  const ex = (id,s,meal)=>({...snap(ITEMS[id],'OceanView',s,meal), placeholder:true, ex:true});
  state = {day:todayKey(), goals:{...DEFAULT_GOALS}, example:true,
    log: realExamples() || [ex('acai',1,'Breakfast'), ex('whey',1,'Breakfast'), ex('shw-bowl',1,'Lunch'), ex('hummus',0.5,'Lunch')]};
} else if(state.day!==todayKey()){
  archiveDay(state);
  state.day=todayKey(); state.log=[]; state.example=false;
}
state.history = state.history || {};
// entries saved by version 1 of the app only stored the item id
state.log = (state.log||[]).map(e=> e.n ? e : (ITEMS[e.id] ? {...snap(ITEMS[e.id],'OceanView',e.s,LETTER[e.p]||'Lunch'), uid:e.uid, placeholder:true} : null)).filter(Boolean);
state.goals = {...DEFAULT_GOALS, ...(state.goals||{})};
save();

const timeMeal = () => { const h=new Date().getHours()+new Date().getMinutes()/60; return h<10.5?'Breakfast':h<16.5?'Lunch':h<21?'Dinner':'Late Night'; };
const mealFor = p => MEALS.includes(p) ? p : p==='Brunch' ? 'Lunch' : p==='Lunch/Dinner' ? (new Date().getHours()<16?'Lunch':'Dinner') : timeMeal();
let hallIdx = null, venue = null, menuPeriod = null, query = '';

function totals(){
  const t={}; NKEYS.forEach(k=>t[k]=0);
  state.log.forEach(e=>NKEYS.forEach(k=>{ t[k]+=(e.n[k]||0)*e.s; }));
  return t;
}
const fmt = n => Math.round(n).toLocaleString('en-US');
const fmtG = n => (Math.round(n*10)/10).toLocaleString('en-US',{maximumFractionDigits:1});
const fmtS = s => s===1 ? '1 serving' : s===0.5 ? '½ serving' : (s%1 ? Math.floor(s)+'½' : s)+' servings';
const esc = s => String(s==null?'':s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const shortDate = iso => { if(!iso) return ''; const [y,m,d]=iso.slice(0,10).split('-').map(Number); return new Date(y,m-1,d).toLocaleDateString('en-US',{month:'short',day:'numeric'}); };

/* ---------- Bubble ring ---------- */
const svg = document.getElementById('ring');
const NS='http://www.w3.org/2000/svg';
const C0=160, RING_R=148, RING_W=10, INNER=134;
svg.innerHTML = `
  <defs>
    ${MACROS.map(m=>`
    <radialGradient id="g-${m.k}" cx="36%" cy="30%" r="75%">
      <stop offset="0" style="stop-color:#fff;stop-opacity:.55"/>
      <stop offset=".32" style="stop-color:${m.color};stop-opacity:.20"/>
      <stop offset="1" style="stop-color:${m.color};stop-opacity:.46"/>
    </radialGradient>`).join('')}
    <clipPath id="inner-clip"><circle cx="${C0}" cy="${C0}" r="${INNER+2}"/></clipPath>
  </defs>
  <circle cx="${C0}" cy="${C0}" r="${RING_R}" fill="none" style="stroke:var(--track)" stroke-width="${RING_W}"/>
  <circle cx="${C0}" cy="${C0}" r="${INNER+2}" style="fill:var(--card-2)" opacity=".55"/>
  <g id="segs" transform="rotate(-90 ${C0} ${C0})"></g>
  <g id="bubbles" clip-path="url(#inner-clip)"></g>
  <g id="labels"></g>`;
const segG = svg.querySelector('#segs'), bubG = svg.querySelector('#bubbles'), labG = svg.querySelector('#labels');
const CIRC = 2*Math.PI*RING_R;
const bubEls = {}, segEls = {}, labEls = {};
MACROS.forEach((m,i)=>{
  const seg=document.createElementNS(NS,'circle');
  seg.setAttribute('cx',C0);seg.setAttribute('cy',C0);seg.setAttribute('r',RING_R);
  seg.setAttribute('fill','none');seg.setAttribute('stroke-width',RING_W);seg.setAttribute('stroke-linecap','round');
  seg.style.stroke=m.color; segG.appendChild(seg); segEls[m.k]=seg;

  const g=document.createElementNS(NS,'g'); g.setAttribute('class','float '+'abc'[i]);
  const c=document.createElementNS(NS,'circle'); c.setAttribute('fill',`url(#g-${m.k})`); c.style.stroke=m.color; c.setAttribute('stroke-width','1.5'); c.setAttribute('stroke-opacity','.55');
  const hl=document.createElementNS(NS,'ellipse'); hl.setAttribute('fill','#fff'); hl.setAttribute('opacity','.5');
  g.appendChild(c); g.appendChild(hl); bubG.appendChild(g); bubEls[m.k]={c,hl};

  const lg=document.createElementNS(NS,'g'); lg.setAttribute('class','float '+'abc'[i]);
  const t1=document.createElementNS(NS,'text'); t1.setAttribute('text-anchor','middle'); t1.style.fill=m.color;
  t1.style.font='800 17px '+getComputedStyle(document.documentElement).getPropertyValue('--round');
  const t2=document.createElementNS(NS,'text'); t2.setAttribute('text-anchor','middle'); t2.style.fill='var(--ink-2)';
  t2.style.font='600 10.5px '+getComputedStyle(document.documentElement).getPropertyValue('--sans'); t2.textContent=m.label;
  lg.appendChild(t1); lg.appendChild(t2); labG.appendChild(lg); labEls[m.k]={t1,t2};
});

let shown = null;
function drawRing(v){
  const goal = state.goals.kcal||1;
  const cals = MACROS.map(m=>v[m.k]*m.kcalPerG);
  const sum = cals.reduce((a,b)=>a+b,0);
  const empty = sum<1;
  const shares = empty ? [1/3,1/3,1/3] : cals.map(c=>c/sum);
  // ring segments: arc length = progress toward goal, split by macro share
  const prog = Math.min(v.kcal/goal,1)*CIRC;
  const gap = RING_W+5;
  let start = 0;
  MACROS.forEach((m,i)=>{
    const len = empty?0:prog*shares[i];
    const seg = segEls[m.k];
    const vis = Math.max(0,len-gap);
    seg.style.opacity = len>1 ? 1 : 0;
    seg.setAttribute('stroke-dasharray', `${Math.max(vis,0.01)} ${CIRC}`);
    seg.setAttribute('stroke-dashoffset', -(start+gap/2));
    start += len;
  });
  // bubbles
  MACROS.forEach((m,i)=>{
    const s = shares[i];
    const r = 30 + 56*Math.sqrt(s);
    const d = INNER - r - 3;
    const a = m.ang*Math.PI/180;
    const cx = C0 + d*Math.cos(a), cy = C0 + d*Math.sin(a);
    const {c,hl} = bubEls[m.k];
    c.setAttribute('cx',cx); c.setAttribute('cy',cy); c.setAttribute('r',r);
    c.style.opacity = empty ? .35 : 1;
    hl.setAttribute('cx',cx - r*.38); hl.setAttribute('cy',cy - r*.44);
    hl.setAttribute('rx',r*.2); hl.setAttribute('ry',r*.12);
    hl.setAttribute('transform',`rotate(-35 ${cx - r*.38} ${cy - r*.44})`);
    const L = Math.max(d + r*0.5, 84);
    const lx = C0 + L*Math.cos(a), ly = C0 + L*Math.sin(a);
    const {t1,t2} = labEls[m.k];
    t1.setAttribute('x',lx); t1.setAttribute('y',ly+1);
    t2.setAttribute('x',lx); t2.setAttribute('y',ly+14);
    t1.textContent = empty ? '—' : Math.round(s*100)+'%';
  });
  document.getElementById('core-kcal').textContent = fmt(v.kcal);
}
function animateRing(target){
  const from = shown || {kcal:0,pro:0,carb:0,fat:0};
  const reduce = matchMedia('(prefers-reduced-motion: reduce)').matches;
  if(reduce){ shown={...target}; drawRing(shown); return; }
  const t0 = performance.now(), D=700;
  const ease = t => 1-Math.pow(1-t,3);
  function step(now){
    const p = Math.min(1,(now-t0)/D), e=ease(p);
    const v={}; ['kcal','pro','carb','fat'].forEach(k=>v[k]=from[k]+(target[k]-from[k])*e);
    drawRing(v);
    if(p<1) requestAnimationFrame(step); else shown={...target};
  }
  requestAnimationFrame(step);
}


/* ---------- Render: Today ---------- */
function renderToday(){
  const t = totals(), g = state.goals;
  document.getElementById('today-date').textContent = new Date().toLocaleDateString('en-US',{weekday:'long',month:'long',day:'numeric'});
  document.getElementById('example-banner').hidden = !state.example;
  document.getElementById('core-of').textContent = `of ${fmt(g.kcal)} kcal`;
  const left = g.kcal - t.kcal;
  document.getElementById('left-line').innerHTML = left>=0
    ? `<b>${fmt(left)}</b> kcal left today`
    : `<b>${fmt(-left)}</b> kcal over your goal`;
  animateRing({kcal:t.kcal,pro:t.pro,carb:t.carb,fat:t.fat});

  // carbs have no limit: show how much room is left in the calorie goal instead
  const carbRoom = Math.max(0, (g.kcal - t.kcal)/4);
  document.getElementById('macros').innerHTML = MACROS.map(m=>{
    const hasGoal = m.k!=='carb';
    const pct = hasGoal ? Math.min(100, t[m.k]/g[m.k]*100) : Math.min(100, t.carb/Math.max(1, t.carb+carbRoom)*100);
    return `<div class="macro">
      <div class="name"><span class="sw" style="background:${m.color}"></span>${m.label}</div>
      <div class="val">${fmtG(t[m.k])}<small>g</small></div>
      <div class="bar"><i style="width:${pct}%;background:${m.color}"></i></div>
      <div class="goal${hasGoal?'':' free'}">${hasGoal ? `of ${fmt(g[m.k])} g` : (carbRoom>0 ? `≈${fmt(carbRoom)} g room left` : 'No limit')}</div>
    </div>`;
  }).join('');

  document.getElementById('nutrients').innerHTML = NUTRIENTS.map(n=>{
    const v=t[n.k];
    const detail = n.goal
      ? `<div class="bar"><i style="width:${Math.min(100,v/g[n.k]*100)}%;background:${n.color}"></i></div>`
      : `<div class="note-sm">${n.k==='carb' ? 'No limit · fills the rest of your calories' : 'No target'}</div>`;
    return `<div class="row nrow">
      <span class="chip-ic" style="background:${n.color}">${n.ic}</span>
      <div class="mid">
        <div class="top"><span class="label">${n.label}</span>
          <span class="amt"><b>${fmtG(v)}</b>${n.goal ? ` / ${fmt(g[n.k])}` : ''} ${n.unit}</span></div>
        ${detail}
      </div>
    </div>`;
  }).join('');

  const mealsEl = document.getElementById('meals');
  document.getElementById('meal-count').textContent = state.log.length ? `${state.log.length} item${state.log.length>1?'s':''}` : '';
  if(!state.log.length){
    mealsEl.innerHTML = `<div class="card empty">Nothing logged yet. Open <b>Dining</b> and tap what you ate.</div>`;
    return;
  }
  const order = [...MEALS, ...new Set(state.log.map(e=>e.meal).filter(m=>!MEALS.includes(m)))];
  mealsEl.innerHTML = order.filter(m=>state.log.some(e=>e.meal===m)).map(m=>{
    const entries = state.log.filter(e=>e.meal===m);
    const sum = entries.reduce((a,e)=>a+(e.n.kcal||0)*e.s,0);
    return `<div class="meal-group">
      <div class="meal-h"><span>${esc(m)}</span><span>${fmt(sum)} kcal</span></div>
      <div class="card list">${entries.map(e=>{
        const partial = MACROS.some(x=>e.n[x.k]==null);
        return `<button class="row food" type="button" data-uid="${e.uid}">
          <div><div class="nm">${esc(e.name)}</div>
            <div class="sub">${esc(e.hall)} · ${fmtS(e.s)}${e.placeholder?' · sample values':''}</div>
            ${partial ? `<div class="partial">Calories only; no nutrition facts listed</div>`
              : `<div class="mini-macros">${MACROS.map(x=>`<span><i style="background:${x.color}"></i>${fmtG(e.n[x.k]*e.s)}g</span>`).join('')}</div>`}
          </div>
          <div class="k">${fmt((e.n.kcal||0)*e.s)}<small>kcal</small></div>
        </button>`;}).join('')}</div>
    </div>`;
  }).join('');
}

/* ---------- Render: Dining ---------- */
let visible = [];
const HALL_COLORS = ['var(--pro)','var(--carb)','var(--fat)','var(--fib)','var(--na)','var(--sug)','var(--sat)','var(--kcal)','var(--chol)'];
const initials = n => n.replace(/^(the|restaurants at)\s+/i,'').split(/\s+/).map(w=>/^\d/.test(w)?w:w[0]).join('').slice(0,2).toUpperCase();
function parseHours(h){
  const m = (h||'').match(/(\d{1,2}):(\d\d)\s*([AP]M)\s*-\s*(\d{1,2}):(\d\d)\s*([AP]M)/i); if(!m) return null;
  const t = (hh,mm,ap) => ((+hh%12) + (ap.toUpperCase()==='PM'?12:0))*60 + +mm;
  return [t(m[1],m[2],m[3]), t(m[4],m[5],m[6])];
}
const fmtT = mins => { const h=Math.floor(mins/60), m=mins%60; return (h%12||12)+(m?':'+String(m).padStart(2,'0'):'')+(h>=12?' PM':' AM'); };
const prettyHours = h => { const r=parseHours(h); return r ? fmtT(r[0])+' – '+fmtT(r[1]) : (h||''); };
function openState(h){
  if(!h) return null;
  if(/closed/i.test(h)) return {k:'closed', label:'Closed today', rank:3};
  if(!MENU.date || MENU.date!==todayISO()) return null;          // hours only apply to the menu's own day
  const r = parseHours(h); if(!r) return null;
  const d = new Date(), now = d.getHours()*60 + d.getMinutes();
  if(now < r[0]) return {k:'later', label:'Opens '+fmtT(r[0]), rank:1};
  if(now >= r[1]) return {k:'closed', label:'Closed now', rank:2};
  return {k:'open', label: r[1]-now<=60 ? 'Closes '+fmtT(r[1]) : 'Open', rank:0};
}
const pill = st => st ? `<span class="st ${st.k}">${esc(st.label)}</span>` : '';
function hallPeriods(items){
  const ps = [...new Set(items.map(i=>i.period||'Menu'))];
  const rank = p => { const i=PERIOD_ORDER.indexOf(p); return i<0 ? 99 : i; };
  return ps.sort((a,b)=>rank(a)-rank(b));
}
function hallVenues(h){
  const names = [...new Set(h.items.map(i=>(i.station||'Menu').split(' · ')[0]))];
  const known = h.venues||[];
  const order = n => { const i=known.findIndex(v=>v.name===n); return i<0 ? 99 : i; };
  return names.sort((a,b)=>order(a)-order(b)).map(n=>({name:n, hours:(known.find(v=>v.name===n)||{}).hours||null}));
}
function renderStatus(){
  const dot=document.getElementById('status-dot'), t=document.getElementById('status-title'), s=document.getElementById('status-sub');
  const n = MENU.halls.reduce((a,h)=>a+h.items.length,0);
  if(MENU.sample){
    dot.className='status-dot warn'; t.textContent='Sample menu';
    s.textContent='Connect to the internet to download today’s menu.';
  } else if(MENU.date && MENU.date!==todayISO()){
    dot.className='status-dot warn'; t.textContent=`Menu from ${shortDate(MENU.date)}`;
    s.textContent = menuCheck.ok===false ? 'You’re offline, so this is the last saved menu.' : 'Today’s menu hasn’t been published yet.';
  } else {
    dot.className='status-dot'; t.textContent='Official HDH nutrition facts';
    const when = MENU.generated ? new Date(MENU.generated).toLocaleTimeString('en-US',{hour:'numeric',minute:'2-digit'}) : '';
    s.textContent=`Today’s menus${when?' · updated '+when:''} · ${n.toLocaleString('en-US')} items${menuCheck.ok===false?' · offline':''}`;
  }
}
// All UCSD dining halls. A hall with no menu for the day (for example Bistro on weekends) still shows, marked closed.
const ALL_HALLS = ['64 Degrees','Bistro','Canyon Vista','Club Med','Foodworx','OceanView','Pines','Sixth College','Ventanas'];
function renderHallList(){
  const listed = MENU.halls.map(h=>h.name.toLowerCase());
  const missing = MENU.sample ? [] : ALL_HALLS.filter(n=>!listed.includes(n.toLowerCase()));
  const today = MENU.date===todayISO();
  const rows = MENU.halls.map((h,i)=>({h,i,st:openState(h.hours),v:hallVenues(h).length}))
    .concat(missing.map(n=>({h:{name:n}, i:null, st:{k:'closed', label: today?'Closed today':'No menu yet', rank:4}, v:0})))
    .sort((a,b)=>((a.st?a.st.rank:2.5)-(b.st?b.st.rank:2.5)) || a.h.name.localeCompare(b.h.name));
  const open = rows.filter(r=>r.st&&r.st.k==='open').length;
  document.getElementById('open-count').textContent = rows.some(r=>r.st) ? `${open} open now` : `${rows.length} halls`;
  document.getElementById('hall-list').innerHTML = rows.map(({h,i,st,v},k)=> i==null ? `
    <div class="hall-row dim">
      <span class="logo" style="background:${HALL_COLORS[(ALL_HALLS.indexOf(h.name)+9)%HALL_COLORS.length]}">${esc(initials(h.name))}</span>
      <span><div class="t">${esc(h.name)}</div><div class="s">${today?'No menu today':'Waiting for today’s menu'}</div></span>
      ${pill(st)}<span></span>
    </div>` : `
    <button class="hall-row${st&&st.k!=='open'?' dim':''}" type="button" data-h="${i}">
      <span class="logo" style="background:${HALL_COLORS[i%HALL_COLORS.length]}">${esc(initials(h.name))}</span>
      <span><div class="t">${esc(h.name)}</div>
        <div class="s">${h.hours&&!/closed/i.test(h.hours)?esc(prettyHours(h.hours))+' · ':''}${v} restaurant${v>1?'s':''}</div></span>
      ${pill(st)}
      <svg class="chev" width="8" height="14" viewBox="0 0 8 14" aria-hidden="true"><path d="M1.5 1.5L6.5 7l-5 5.5" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></svg>
    </button>`).join('');
}
function renderMenu(){
  const inHall = hallIdx!=null && !!MENU.halls[hallIdx];
  document.getElementById('hall-list-view').hidden = inHall;
  document.getElementById('hall-view').hidden = !inHall;
  document.getElementById('back-halls').hidden = !inHall;
  document.getElementById('menu-date').hidden = inHall;
  document.getElementById('menu-date').textContent = new Date().toLocaleDateString('en-US',{weekday:'long',month:'long',day:'numeric'});
  if(!inHall){ document.getElementById('menu-title').textContent='Dining'; renderStatus(); renderHallList(); return; }

  const hall = MENU.halls[hallIdx];
  document.getElementById('menu-title').textContent = hall.name;
  const st = openState(hall.hours);
  document.getElementById('hall-meta').innerHTML = hall.hours
    ? `${pill(st)}<span>${/closed/i.test(hall.hours)?'':esc(prettyHours(hall.hours))}${MENU.date&&MENU.date!==todayISO()?' on '+shortDate(MENU.date):''}</span>` : '';

  const venues = hallVenues(hall);
  if(venue && !venues.some(v=>v.name===venue)) venue = null;
  const vEl = document.getElementById('venues');
  vEl.parentElement.hidden = venues.length<2;
  vEl.innerHTML = [`<button type="button" data-v="" aria-pressed="${!venue}">All<span class="h">${venues.length} restaurants</span></button>`]
    .concat(venues.map(v=>{ const s=openState(v.hours); return `<button type="button" data-v="${esc(v.name)}" aria-pressed="${venue===v.name}" class="${s&&s.k!=='open'&&s.k!=='later'?'off':''}">${esc(v.name)}<span class="h">${s?esc(s.label):(v.hours?esc(prettyHours(v.hours)):'&nbsp;')}</span></button>`; })).join('');

  const inVenue = hall.items.filter(i=>!venue || (i.station||'Menu').split(' · ')[0]===venue);
  const periods = hallPeriods(inVenue);
  if(!periods.includes(menuPeriod)){
    const tm = timeMeal();
    menuPeriod = periods.includes(tm) ? tm : (tm==='Lunch'&&periods.includes('Brunch')) ? 'Brunch'
      : (periods.includes('Lunch/Dinner') && (tm==='Lunch'||tm==='Dinner')) ? 'Lunch/Dinner'
      : (tm==='Late Night' && periods.includes('Dinner')) ? 'Dinner' : periods[0];
  }
  const segEl = document.getElementById('period');
  segEl.hidden = periods.length<2;
  segEl.innerHTML = periods.map(p=>`<button type="button" data-p="${esc(p)}" aria-pressed="${p===menuPeriod}">${esc(p)}</button>`).join('');
  document.getElementById('q').placeholder = `Search ${venue||hall.name}`;

  const q = query.trim().toLowerCase();
  visible = inVenue.filter(it=>(it.period||'Menu')===menuPeriod && (!q || [it.name,it.desc,it.station,it.sub].join(' ').toLowerCase().includes(q)));
  const el = document.getElementById('menu');
  document.getElementById('menu-note').textContent = MENU.sample ? '' : 'Nutrition facts come from each item’s UCSD HDH nutrition page. Recipes can change on the day, so treat totals as close estimates.';
  if(!visible.length){ el.innerHTML = `<div class="card empty">${q?`No ${esc(menuPeriod.toLowerCase())} items match “${esc(query)}”.`:`Nothing listed for ${esc(menuPeriod.toLowerCase())}.`}</div>`; return; }
  const groupOf = it => { const [stn, rest] = (it.station||'Menu').split(' · '); const sub = it.sub || rest || '';
    return venue ? (sub || stn) : (sub ? stn+' · '+sub : stn); };
  const groups = [...new Set(visible.map(groupOf))];
  el.innerHTML = groups.map(g=>{
    const rows = visible.map((it,i)=>({it,i})).filter(x=>groupOf(x.it)===g);
    return `<div class="meal-group">
      <div class="meal-h"><span>${esc(g)}</span><span>${rows.length} item${rows.length>1?'s':''}</span></div>
      <div class="card list">${rows.map(({it,i})=>`
        <div class="row menu-item" data-i="${i}" tabindex="0" role="button" aria-label="${esc(it.name)}, ${fmt(it.n.kcal||0)} calories">
          <div><div class="nm">${esc(it.name)}${(it.diet||[]).filter(d=>d!=='Wellness').map(d=>`<span class="diet">${esc(d)}</span>`).join('')}</div>${it.desc&&it.desc!==it.name?`<div class="ds">${esc(it.desc)}</div>`:''}
            ${it.complete===false?'<div class="partial">Calories only</div>':''}</div>
          <div class="right">
            <div class="k">${fmt(it.n.kcal||0)}<small>kcal</small></div>
            <button class="add" type="button" data-quick="${i}" aria-label="Add ${esc(it.name)}">
              <svg width="14" height="14" viewBox="0 0 14 14" aria-hidden="true"><path d="M7 1.5v11M1.5 7h11" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"/></svg>
            </button>
          </div>
        </div>`).join('')}</div>
    </div>`;
  }).join('');
}

const root = document.getElementById('sheet-root');
function openSheet(html, bind){
  root.innerHTML = `<div class="scrim" id="scrim"><div class="sheet" role="dialog" aria-modal="true"><div class="grabber"></div>${html}</div></div>`;
  const scrim = root.querySelector('#scrim');
  requestAnimationFrame(()=>scrim.classList.add('show'));
  document.body.classList.add('sheet-open');   // the page behind stays still while the sheet scrolls
  scrim.addEventListener('click',e=>{ if(e.target===scrim) closeSheet(); });
  root.querySelectorAll('[data-close]').forEach(b=>b.onclick=closeSheet);
  bind && bind(root.querySelector('.sheet'));
  const f = root.querySelector('.sheet button, .sheet input'); f && f.focus({preventScroll:true});

function closeSheet(){
  const s=root.querySelector('#scrim'); if(!s) return;
  document.body.classList.remove('sheet-open');
  if(document.activeElement && document.activeElement.blur) document.activeElement.blur();
  s.classList.remove('show'); setTimeout(()=>{ root.innerHTML=''; },220);
}

    <div class="r"><span><b>Sodium</b> ${g('na','mg')}</span><b>${dv('na')}</b></div>
    <div class="r"><span><b>Total Carbohydrate</b> ${g('carb','g')}</span><b>${dv('carb')}</b></div>
    <div class="r ind"><span>Dietary Fiber ${g('fib','g')}</span><b>${dv('fib')}</b></div>
    <div class="r ind"><span>Total Sugars ${g('sug','g')}</span><span></span></div>

    <div class="foot">*Percent Daily Values are based on a 2,000 calorie diet. ${foot}${kcalNote}${it.allergens?`<br><b>Contains:</b> ${esc(it.allergens)}`:''}${(it.diet||[]).length?`<br><b>Diet:</b> ${esc(it.diet.join(', '))}`:''}</div>
  </div>`;

/* ---------- Week tab: history bar chart ---------- */
const METRICS = [
  {k:'kcal', label:'Calories', unit:'kcal', color:'var(--ch-kcal)', goal:'kcal'},
  {k:'pro',  label:'Protein',  unit:'g',    color:'var(--ch-pro)',  goal:'pro'},
  {k:'carb', label:'Carbs',    unit:'g',    color:'var(--ch-carb)'},
  {k:'fat',  label:'Fat',      unit:'g',    color:'var(--ch-fat)',  goal:'fat'},
  {k:'fib',  label:'Fiber',    unit:'g',    color:'var(--ch-fib)'},
];
const wk = {metric:'kcal', range:'W', offset:0, sel:null, hover:null, bars:[]};
const addDays = (d,n) => { const x=new Date(d); x.setDate(x.getDate()+n); return x; };
const today0 = () => { const d=new Date(); d.setHours(0,0,0,0); return d; };
const MONTHS = ['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'];

// Believable past days so the chart has something to show while the example day is on.
function sampleHistory(){
  const out = {}; let seed = 20260925;
  const rnd = () => (seed = seed*16807 % 2147483647) / 2147483647;
  const t = today0();
  for(let i=1;i<=420;i++){
    if(rnd() < 0.15) continue;
    const pro=95+rnd()*70, fat=48+rnd()*40, carb=170+rnd()*150, fib=12+rnd()*18;
    out[isoOf(addDays(t,-i))] = {pro:r1(pro), fat:r1(fat), carb:r1(carb), fib:r1(fib), kcal:Math.round(pro*4+carb*4+fat*9), n:3};
  }
  return out;
}
function historyMap(){
  const h = {...(state.example ? sampleHistory() : {}), ...(state.history||{})};
  const live = state.example ? state.log : realEntries(state.log);
  if(live.length) h[isoOf(today0())] = dayTotals(live);
  return h;
}

// Build the bars for the current range. Day bars carry a day total; month/year bars carry a daily average.
function buildBars(){
  const H = historyMap(), k = wk.metric, t = today0(), bars = [];
  const dayBar = (d, label, strong) => { const e=H[isoOf(d)];
    return {label, strong, title:d.toLocaleDateString('en-US',{weekday:'short',month:'short',day:'numeric'}),
      value: e ? e[k] : null, sum: e ? e[k] : 0, days: e ? 1 : 0, future: d>t, day:isoOf(d)}; };
  const groupBar = (from, to, label, title) => { let sum=0, days=0;
    for(let d=new Date(from); d<=to; d=addDays(d,1)){ const e=H[isoOf(d)]; if(e){ sum+=e[k]; days++; } }
    return {label, title, value: days ? sum/days : null, sum, days, future: from>t, avg:true}; };
  let rangeText = '', periodStart, periodEnd;
  if(wk.range==='W'){
    periodStart = addDays(t, -t.getDay() + 7*wk.offset); periodEnd = addDays(periodStart, 6);
    for(let i=0;i<7;i++){ const d=addDays(periodStart,i); bars.push(dayBar(d, 'SMTWTFS'[i], +d===+t)); }
    const same = periodStart.getMonth()===periodEnd.getMonth();
    rangeText = `${MONTHS[periodStart.getMonth()]} ${periodStart.getDate()}–${same?'':MONTHS[periodEnd.getMonth()]+' '}${periodEnd.getDate()}, ${periodEnd.getFullYear()}`;
  } else if(wk.range==='M'){
    periodStart = new Date(t.getFullYear(), t.getMonth()+wk.offset, 1); periodEnd = new Date(periodStart.getFullYear(), periodStart.getMonth()+1, 0);
    for(let d=new Date(periodStart); d<=periodEnd; d=addDays(d,1)) bars.push(dayBar(d, [1,8,15,22,29].includes(d.getDate()) ? String(d.getDate()) : '', +d===+t));
    rangeText = periodStart.toLocaleDateString('en-US',{month:'long',year:'numeric'});
  } else if(wk.range==='Y'){
    const y = t.getFullYear()+wk.offset; periodStart = new Date(y,0,1); periodEnd = new Date(y,11,31);
    for(let m=0;m<12;m++) bars.push(groupBar(new Date(y,m,1), new Date(y,m+1,0), MONTHS[m][0], `${MONTHS[m]} ${y}`));
    rangeText = String(y);
  } else {
    const keys = Object.keys(H).sort();
    const first = keys.length ? new Date(keys[0]+'T00:00') : t;
    const months = (t.getFullYear()-first.getFullYear())*12 + t.getMonth()-first.getMonth() + 1;
    if(months <= 24){
      for(let i=months-1;i>=0;i--){ const s=new Date(t.getFullYear(), t.getMonth()-i, 1);
        bars.push(groupBar(s, new Date(s.getFullYear(), s.getMonth()+1, 0), s.getMonth()===0 || i===months-1 ? `${MONTHS[s.getMonth()]} ’${String(s.getFullYear()).slice(2)}` : (months<=12 ? MONTHS[s.getMonth()][0] : ''), `${MONTHS[s.getMonth()]} ${s.getFullYear()}`)); }
    } else {
      for(let y=first.getFullYear(); y<=t.getFullYear(); y++) bars.push(groupBar(new Date(y,0,1), new Date(y,11,31), String(y), String(y)));
    }
    periodStart = first; periodEnd = t;
    rangeText = keys.length ? `${first.toLocaleDateString('en-US',{month:'short',year:'numeric'})} – today` : 'No history yet';
  }
  return {bars, rangeText, periodStart, periodEnd, H};
}
const niceStep = raw => { const p=Math.pow(10, Math.floor(Math.log10(raw))); const f=raw/p; return (f<=1?1:f<=2?2:f<=2.5?2.5:f<=5?5:10)*p; };
const fmtVal = (v, m) => v==null ? '—' : (m.unit==='kcal' ? fmt(v) : fmtG(v));

function drawChart(bars, metric, goalVal){
  const box = document.getElementById('wk-chart');
  const W = Math.max(260, box.clientWidth || 320), H = 210, top = 14, bottom = 24, right = 38;
  const plotW = W - right, plotH = H - top - bottom, n = bars.length, step = plotW / n;
  const bw = Math.max(2, Math.min(step - 2, n <= 7 ? 30 : n <= 12 ? 22 : step*0.72));
  const vals = bars.map(b=>b.value).filter(v=>v!=null);
  const maxV = Math.max(1, ...vals, goalVal||0);
  const st = niceStep(maxV/3), yMax = Math.ceil(maxV*1.02/st)*st;
  const y = v => top + plotH - (v/yMax)*plotH;
  const active = wk.hover ?? wk.sel;
  let g = '';
  const tickTxt = v => metric.unit==='kcal'&&v>=1000 ? (Math.round(v/100)/10)+'k' : Math.round(v);
  for(let v=0; v<=yMax+1e-9; v+=st){
    g += `<line x1="0" x2="${plotW}" y1="${y(v)}" y2="${y(v)}" style="stroke:var(--hair)" stroke-width="1"/>`;
    if(!goalVal || Math.abs(y(v)-y(goalVal))>13)
      g += `<text x="${plotW+6}" y="${y(v)+4}" font-size="11" style="fill:var(--ink-3)" font-family="inherit">${tickTxt(v)}</text>`;
  }
  bars.forEach((b,i)=>{
    const cx = step*i + step/2;
    if(b.value!=null && b.value>0){
      const h = Math.max(2, y(0)-y(b.value)), x = cx-bw/2, r = Math.min(4, bw/2, h);
      const yy = y(0)-h;
      g += `<path d="M${x},${y(0)} V${yy+r} Q${x},${yy} ${x+r},${yy} H${x+bw-r} Q${x+bw},${yy} ${x+bw},${yy+r} V${y(0)} Z" style="fill:${metric.color}" opacity="${active!=null && active!==i ? .32 : 1}"/>`;
    }
    if(b.label) g += `<text x="${cx}" y="${H-6}" text-anchor="middle" font-size="11" font-weight="${b.strong?800:500}" style="fill:${b.strong?'var(--ink)':'var(--ink-3)'}" font-family="inherit">${esc(b.label)}</text>`;
  });
  if(goalVal){
    g += `<line x1="0" x2="${plotW}" y1="${y(goalVal)}" y2="${y(goalVal)}" style="stroke:var(--ink-2)" stroke-width="1.5" stroke-dasharray="4 4"/>`;
    g += `<text x="${plotW+6}" y="${y(goalVal)+4}" font-size="11" font-weight="800" style="fill:var(--ink)" font-family="inherit">${tickTxt(goalVal)}</text>`;
    g += `<text x="${plotW+6}" y="${y(goalVal)-9}" font-size="9.5" font-weight="700" style="fill:var(--ink-2)" font-family="inherit">GOAL</text>`;
  }
  // full-height hit targets, one per bar
  bars.forEach((b,i)=>{ g += `<rect data-i="${i}" x="${step*i}" y="0" width="${step}" height="${H-bottom}" fill="transparent" style="cursor:${b.value!=null?'pointer':'default'}"/>`; });
  const empty = !vals.length ? `<div class="empty-msg">Nothing logged in this ${ {W:'week',M:'month',Y:'year',A:'range'}[wk.range] }. Days you log on the Today tab show up here.</div>` : '';
  box.innerHTML = `<svg viewBox="0 0 ${W} ${H}" height="${H}" role="img" aria-label="${esc(metric.label)} bar chart">${g}</svg>${empty}`;
}

function renderWeek(){
  const metric = METRICS.find(m=>m.k===wk.metric);
  const goalVal = metric.goal ? state.goals[metric.goal] : null;
  document.getElementById('wk-title').textContent = metric.label;
  document.getElementById('wk-sample').hidden = !state.example;
  document.getElementById('wk-metrics').innerHTML = METRICS.map(m=>`<button type="button" data-m="${m.k}" aria-pressed="${m.k===wk.metric}"><span class="dot" style="background:${m.color}"></span>${m.label}</button>`).join('');
  document.querySelectorAll('#wk-range button').forEach(b=>b.setAttribute('aria-pressed', b.dataset.r===wk.range));
  const {bars, rangeText, periodStart, H} = buildBars();
  wk.bars = bars;
  if(wk.sel!=null && (wk.sel>=bars.length || bars[wk.sel].value==null)) wk.sel = null;

  // header: the tapped/hovered bar, or the period's daily average over logged days
  const active = wk.hover ?? wk.sel;
  const logged = bars.reduce((a,b)=>a+b.days,0), sum = bars.reduce((a,b)=>a+b.sum,0);
  if(active!=null && bars[active] && bars[active].value!=null){
    const b = bars[active];
    document.getElementById('wk-label').textContent = b.avg ? 'Daily average' : 'Total';
    document.getElementById('wk-value').textContent = fmtVal(b.value, metric);
    document.getElementById('wk-rangetext').textContent = b.avg ? `${b.title} · ${b.days} day${b.days>1?'s':''} logged` : b.title;
  } else {
    document.getElementById('wk-label').textContent = 'Daily average';
    document.getElementById('wk-value').textContent = logged ? fmtVal(sum/logged, metric) : '—';
    document.getElementById('wk-rangetext').textContent = logged ? `${rangeText} · ${logged} day${logged>1?'s':''} logged` : rangeText;
  }
  document.getElementById('wk-unit').textContent = metric.unit;
  const keys = Object.keys(H).sort(), earliest = keys.length ? new Date(keys[0]+'T00:00') : today0();
  document.getElementById('wk-prev').disabled = wk.range==='A' || periodStart <= earliest;
  document.getElementById('wk-next').disabled = wk.range==='A' || wk.offset>=0;
  drawChart(bars, metric, goalVal);

  // stats for the period, always from individual days
  const dayVals = [];
  const pEnd = wk.range==='A' ? today0() : (wk.range==='W' ? addDays(periodStart,6) : wk.range==='M' ? new Date(periodStart.getFullYear(), periodStart.getMonth()+1, 0) : new Date(periodStart.getFullYear(),11,31));
  keys.forEach(k=>{ const d=new Date(k+'T00:00'); if(d>=periodStart && d<=pEnd) dayVals.push({d, v:H[k][metric.k]}); });
  const best = dayVals.reduce((a,b)=> !a || b.v>a.v ? b : a, null);
  const stats = [];
  if(goalVal){
    const hit = metric.k==='kcal' ? dayVals.filter(x=>Math.abs(x.v-goalVal)<=goalVal*0.1).length : dayVals.filter(x=>x.v>=goalVal).length;
    stats.push([metric.k==='kcal' ? 'Days within 10% of goal' : 'Days at or above goal', `${hit}<small>of ${dayVals.length}</small>`]);
  }
  stats.push(['Highest day', best ? `${fmtVal(best.v, metric)}<small>${metric.unit} · ${best.d.toLocaleDateString('en-US',{month:'short',day:'numeric'})}</small>` : '—']);
  document.getElementById('wk-stats').innerHTML = stats.map(([a,b])=>`<div class="stat"><span>${a}</span><b>${b}</b></div>`).join('');
  document.getElementById('wk-table').innerHTML = `<table><thead><tr><th>${bars[0]&&bars[0].avg?'Month / year':'Day'}</th><th>${esc(metric.label)} (${metric.unit}${bars[0]&&bars[0].avg?', daily avg':''})</th></tr></thead><tbody>${
    bars.filter(b=>b.value!=null).map(b=>`<tr><td>${esc(b.title)}</td><td>${fmtVal(b.value, metric)}</td></tr>`).join('') || '<tr><td colspan="2">Nothing logged</td></tr>'}</tbody></table>`;
}
document.getElementById('wk-metrics').addEventListener('click',e=>{ const b=e.target.closest('[data-m]'); if(!b) return; wk.metric=b.dataset.m; renderWeek(); });
document.getElementById('wk-range').addEventListener('click',e=>{ const b=e.target.closest('[data-r]'); if(!b) return; wk.range=b.dataset.r; wk.offset=0; wk.sel=null; renderWeek(); });
document.getElementById('wk-prev').onclick=()=>{ wk.offset--; wk.sel=null; renderWeek(); };
document.getElementById('wk-next').onclick=()=>{ if(wk.offset<0){ wk.offset++; wk.sel=null; renderWeek(); } };
const wkChart = document.getElementById('wk-chart');
wkChart.addEventListener('click',e=>{ const r=e.target.closest('rect[data-i]'); if(!r) return; const i=+r.dataset.i; if(wk.bars[i].value==null) return; haptic(); wk.sel = wk.sel===i ? null : i; wk.hover=null; renderWeek(); });
wkChart.addEventListener('pointermove',e=>{ if(e.pointerType!=='mouse') return; const r=e.target.closest('rect[data-i]'); const i=r ? +r.dataset.i : null; const v = i!=null && wk.bars[i] && wk.bars[i].value!=null ? i : null; if(v!==wk.hover){ wk.hover=v; renderWeek(); } });
wkChart.addEventListener('pointerleave',()=>{ if(wk.hover!=null){ wk.hover=null; renderWeek(); } });
let wkResize; window.addEventListener('resize',()=>{ clearTimeout(wkResize); wkResize=setTimeout(()=>{ if(!document.getElementById('scr-week').hidden) renderWeek(); },120); });

/* ---------- Phone app: haptics and the live menu ---------- */
const IS_NATIVE = !!(window.Capacitor && typeof window.Capacitor.isNativePlatform==='function' && window.Capacitor.isNativePlatform());
function haptic(kind){
  try{
    const H = window.Capacitor && window.Capacitor.Plugins && window.Capacitor.Plugins.Haptics;
    if(H && H.impact){ H.impact({style: kind==='medium' ? 'MEDIUM' : 'LIGHT'}); return; }
    if(IS_NATIVE && navigator.vibrate) navigator.vibrate(kind==='medium' ? 14 : 6);
  }catch(e){}
}
// The published menu file; the app built into the store version checks it whenever it opens.
const MENU_URL = 'https://refreshrefreshclan-lang.github.io/triton-fuel/menu.json';
const menuCheck = {at:0, ok:null};
function rerenderCurrent(){
  if(!document.getElementById('scr-menu').hidden) renderMenu();
  else if(!document.getElementById('scr-week').hidden) renderWeek();
}
// Only the phone app and the GitHub Pages site can reach the menu file (other hosts block the request).
const CAN_FETCH = IS_NATIVE || /\.github\.io$/.test(location.hostname);
async function refreshMenu(force){
  if(!CAN_FETCH) return;
  if(!force && Date.now()-menuCheck.at < 15*60*1000) return;
  menuCheck.at = Date.now();
  try{
    const ctl = new AbortController(); const timer = setTimeout(()=>ctl.abort(), 9000);
    const r = await fetch(MENU_URL+'?t='+Date.now(), {cache:'no-store', signal:ctl.signal});
    clearTimeout(timer);
    if(!r.ok) throw new Error('HTTP '+r.status);
    const raw = await r.json();
    const m = useMenuCalories(expandMenu(raw));
    if(!validMenu(m)) throw new Error('not a menu');
    menuCheck.ok = true;
    if(MENU.sample || String(m.generated||'') > String(MENU.generated||'')){
      try{ localStorage.setItem(MENU_KEY, JSON.stringify(raw)); }catch(e){}
      MENU = m;
      if(hallIdx!=null && !MENU.halls[hallIdx]) hallIdx = null;
    }
  }catch(e){ menuCheck.ok = false; }
  rerenderCurrent();
}
document.addEventListener('visibilitychange', ()=>{ if(document.visibilityState==='visible') refreshMenu(false); });

/* ---------- Wiring ---------- */
function show(tab){
  haptic();
  ['today','menu','week'].forEach(t=>{
    document.getElementById('scr-'+t).hidden = t!==tab;
    document.getElementById('tab-'+t).setAttribute('aria-selected', t===tab);
  });
  if(tab==='today'){ shown=null; renderToday(); } else if(tab==='menu') renderMenu(); else { wk.hover=null; renderWeek(); }
  window.scrollTo(0,0);
}
document.getElementById('tab-today').onclick=()=>show('today');
document.getElementById('tab-menu').onclick=()=>show('menu');
document.getElementById('tab-week').onclick=()=>show('week');
document.getElementById('open-goals').onclick=goalsSheet;
document.getElementById('start-fresh').onclick=()=>{
  const prev=state.log.slice(); state.log=[]; state.example=false; save(); renderToday();
  toast('Examples cleared', ()=>{ state.log=prev; state.example=true; save(); renderToday(); });
};
document.getElementById('hall-list').addEventListener('click',e=>{
  const b=e.target.closest('[data-h]'); if(!b) return; hallIdx=+b.dataset.h; venue=null; menuPeriod=null; query=''; document.getElementById('q').value=''; renderMenu(); window.scrollTo(0,0);
});
document.getElementById('back-halls').onclick=()=>{ hallIdx=null; renderMenu(); window.scrollTo(0,0); };
document.getElementById('venues').addEventListener('click',e=>{
  const b=e.target.closest('[data-v]'); if(!b) return; venue=b.dataset.v||null; renderMenu();
});
document.getElementById('period').addEventListener('click',e=>{
  const b=e.target.closest('[data-p]'); if(!b) return; menuPeriod=b.dataset.p; renderMenu();
});
document.getElementById('q').addEventListener('input',e=>{ query=e.target.value; renderMenu(); });
document.getElementById('menu').addEventListener('click',e=>{
  const q=e.target.closest('[data-quick]');
  if(q){ e.stopPropagation(); const it=visible[+q.dataset.quick]; addItem(it,1,mealFor(menuPeriod)); return; }
  const r=e.target.closest('.menu-item'); if(r) itemSheet(visible[+r.dataset.i]);
});
document.getElementById('menu').addEventListener('keydown',e=>{
  if((e.key==='Enter'||e.key===' ') && e.target.classList.contains('menu-item')){ e.preventDefault(); itemSheet(visible[+e.target.dataset.i]); }
});
document.getElementById('meals').addEventListener('click',e=>{
  const b=e.target.closest('.food'); if(!b) return;
  const entry=state.log.find(x=>x.uid===b.dataset.uid); if(entry) itemSheet(entry, entry);
});

if(location.hash==='#dining') show('menu'); else if(location.hash==='#week') show('week'); else renderToday();
refreshMenu(true);
})();
</script>
