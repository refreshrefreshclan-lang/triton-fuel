# Builds an installable Android test app (APK) from the latest published app.
# Run it from the Actions tab ("Build Android app" > Run workflow); the APK appears under the run's Artifacts.
# Once the four ANDROID_* secrets are added (Settings > Secrets and variables > Actions), it also builds
# the signed bundle (AAB) that you upload to Google Play.

name: Build Android app

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: ["mobile/**", "app_template.html", ".github/workflows/build-android.yml"]

jobs:
  android:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    env:
      KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
    defaults:
      run:
        working-directory: mobile
    steps:
      - name: Get the code
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - name: Install Capacitor
        run: npm install --no-audit --no-fund

      - name: Copy the app into the shell
        run: npm run prepare-web

      - name: Make icons and launch screens
        run: npm run assets

      - name: Create the Android project
        run: |
          npx cap add android
          npx capacitor-assets generate --android
          npx cap sync android

      - name: Set the version number
        working-directory: mobile/android
        run: |
          # Google Play needs a higher version code for every upload; the run number always goes up.
          sed -i -E "s/versionCode [0-9]+/versionCode ${{ github.run_number }}/; s/versionName \"[^\"]*\"/versionName \"1.0.${{ github.run_number }}\"/" app/build.gradle
          grep -E "versionCode|versionName|targetSdk" app/build.gradle variables.gradle || true

      - name: Build the APK
        working-directory: mobile/android
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon

      - name: Build the signed Play Store bundle
        if: env.KEYSTORE_BASE64 != ''
        working-directory: mobile/android
        env:
          KS_PASS: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          KEY_PASS: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          echo "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/upload.jks"
          ./gradlew bundleRelease --no-daemon \
            -Pandroid.injected.signing.store.file="$RUNNER_TEMP/upload.jks" \
            -Pandroid.injected.signing.store.password="$KS_PASS" \
            -Pandroid.injected.signing.key.alias="$KEY_ALIAS" \
            -Pandroid.injected.signing.key.password="$KEY_PASS"
          rm -f "$RUNNER_TEMP/upload.jks"

      - name: Save the APK
        uses: actions/upload-artifact@v4
        with:
          name: triton-fuel-android
          path: mobile/android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error

      - name: Save the Play Store bundle
        if: env.KEYSTORE_BASE64 != ''
        uses: actions/upload-artifact@v4
        with:
          name: triton-fuel-play-bundle
          path: mobile/android/app/build/outputs/bundle/release/app-release.aab
          if-no-files-found: error
