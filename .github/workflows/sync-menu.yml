# Triton Fuel: refresh UCSD dining menus automatically.
# GitHub reads this file and runs the steps below on its own computers, on the schedule set here.

name: Sync UCSD menus

on:
  schedule:
    # Times are in UTC: about 12:30 AM, 5:30, 6:30, 8, 10 AM, 12, 3 and 6 PM Pacific while daylight time is on
    # (one hour earlier in winter). GitHub sometimes skips or delays a scheduled run, so there are extra
    # runs as backups. A run that finds the same menu changes nothing.
    - cron: "30 7 * * *"
    - cron: "30 12 * * *"
    - cron: "30 13 * * *"
    - cron: "0 15 * * *"
    - cron: "0 17 * * *"
    - cron: "0 19 * * *"
    - cron: "0 22 * * *"
    - cron: "0 1 * * *"
  workflow_dispatch:        # adds a "Run workflow" button so you can start it by hand

permissions:
  contents: write           # lets the run save the new menu back into this repository

concurrency:
  group: menu-sync          # never run two syncs at the same time
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      TZ: America/Los_Angeles   # so "today" and the update time are in San Diego time

    steps:
      - name: Get the code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install the script's helpers
        run: pip install -r requirements.txt

      - name: Read today's menus and nutrition facts
        run: python sync_menu.py --publish docs

      - name: Save the new menu to the repository
        run: |
          git config user.name "menu-sync-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs
          if git diff --cached --quiet; then
            echo "Menu unchanged since the last run; nothing to save."
          else
            git commit -m "Menu update $(date +'%a %b %-d, %-I:%M %p')"
            git push
          fi

      # The menu above is already saved. If the script noticed something off (a hall moved, or a hall that's
      # open today had no readable menu), this step fails the run on purpose so GitHub emails you.
      - name: Check for problems
        run: |
          if [ -s output/problems.txt ]; then
            echo "The menu was published, but these need a look:"
            sed 's/^/::error::/' output/problems.txt
            exit 1
          fi
          echo "No problems found."
